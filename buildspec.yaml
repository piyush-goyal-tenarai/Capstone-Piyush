version: 0.2

env:
  variables:
    APP_NAME: "capstone-project"
    ENV_NAME: "capstone-project-env"
    S3_BUCKET: "piyush-capstone-s3"
    AWS_REGION: "eu-north-1"

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - 'echo "Installing dependencies..."'
      - 'go mod download'

  pre_build:
    commands:
      - 'echo "Running unit tests..."'
      - 'go test -v ./tests/...'
      - 'echo "Creating deployment version string..."'
      - 'BUILD_ID=$(date +%Y%m%d%H%M%S)'
      - 'ARTIFACT_NAME="${APP_NAME}-${BUILD_ID}.zip"'

  build:
    commands:
      - 'echo "Building binary for Linux (Elastic Beanstalk target)..."'
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o application main.go'
      - 'echo "Creating Procfile..."'
      - 'echo "web: ./application" > Procfile'

  post_build:
    commands:
      - 'echo "Packaging application archive..."'
      - 'zip -r ${ARTIFACT_NAME} application Procfile config/ scripts/'
      - 'echo "Uploading build artifact to Amazon S3..."'
      - 'aws s3 cp ${ARTIFACT_NAME} s3://${S3_BUCKET}/${ARTIFACT_NAME} --region ${AWS_REGION}'
      - 'echo "Creating Elastic Beanstalk application version..."'
      - 'aws elasticbeanstalk create-application-version --application-name "${APP_NAME}" --version-label "${BUILD_ID}" --source-bundle S3Bucket="${S3_BUCKET}",S3Key="${ARTIFACT_NAME}" --region ${AWS_REGION}'
      - 'echo "Updating Elastic Beanstalk environment..."'
      - 'aws elasticbeanstalk update-environment --environment-name "${ENV_NAME}" --version-label "${BUILD_ID}" --region ${AWS_REGION}'
      - 'echo "Build and deployment triggered successfully."'

artifacts:
  files:
    - application
    - Procfile
  discard-paths: no