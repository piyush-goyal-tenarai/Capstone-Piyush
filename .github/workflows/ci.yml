name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -v ./...
      - name: Unit Tests
        run: go test -v -race ./tests/...
      - name: Vet
        run: go vet ./...
      - name: Docker Build
        run: docker build -t order-management:latest .
